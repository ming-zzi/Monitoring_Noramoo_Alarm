name: FM_Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 여기에 권한 설정을 명시적으로 추가합니다
    permissions:
      contents: write 
      
    steps:
      - uses: actions/checkout@v4 # 최신 버전으로 업데이트
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run Monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 파일이 있을 때만 업데이트하도록 수정
          if [ -f last_id.txt ]; then
            git add last_id.txt
            git commit -m "Update last post ID" || echo "No changes to commit"
            git push
          fi
